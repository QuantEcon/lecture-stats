name: Build & Publish to GH Pages
on:
  push:
    tags:
      - 'publish*'
permissions:
  contents: write   # peaceiris/actions-gh-pages pushes the built site to gh-pages
  actions: read     # dawidd6/action-download-artifact reads the cache.yml build artifact
jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.2xlarge/image=quantecon_ubuntu2404/volume=80gb/spot=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Anaconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: "3.12"
          environment-file: environment.yml
          activate-environment: quantecon
      - name: Install JAX, Numpyro
        shell: bash -l {0}
        run: |
          # CUDA 12 stack. .github/runs-on.yml pins ami-09baf66e396fa7cfd, a CUDA 12
          # AMI, so do not move to cu130 / jax[cuda13] without bumping the AMI first.
          pip install torch --index-url https://download.pytorch.org/whl/cu128
          pip install pyro-ppl
          pip install "jax[cuda12]==0.7.1"
          pip install numpyro
          # See the equivalent block in ci.yml for why the conda stack must be held.
          python -c "import importlib.metadata as md; d={x.metadata['Name'].lower():x.version for x in md.distributions()}; print('\n'.join(f'{p}=={d[p]}' for p in ('numpy','pandas','scipy') if p in d))" > /tmp/conda-pins.txt
          cat /tmp/conda-pins.txt
          pip install --only-binary=:all: -c /tmp/conda-pins.txt "arviz<1" "pymc<6" "kaleido<1" "prettytable<3.18"
          python -c "import numpy, numba; assert numpy.__version__.startswith('1.'), numpy.__version__"
          python scripts/test-jax-install.py
      - name: Check nvidia drivers
        shell: bash -l {0}
        run: |
          nvidia-smi
      - name: Display Conda Environment Versions
        shell: bash -l {0}
        run: conda list
      - name: Display Pip Versions
        shell: bash -l {0}
        run: pip list
      # Download Build Cache from cache.yml
      - name: Download "build" folder (cache)
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: cache.yml
          branch: main
          name: build-cache
          path: _build
      # Build Assets (Download Notebooks, PDF via LaTeX)
      - name: Build PDF from LaTeX
        shell: bash -l {0}
        run: |
          jb build lectures --builder pdflatex --path-output ./ -n -W --keep-going
      - name: Copy LaTeX PDF for GH-PAGES
        shell: bash -l {0}
        run: |
          mkdir -p _build/html/_pdf
          cp -u _build/latex/*.pdf _build/html/_pdf
      - name: Build Download Notebooks (sphinx-tojupyter)
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ --builder=custom --custom-builder=jupyter -n -W --keep-going
          zip -r download-notebooks.zip _build/jupyter
      - uses: actions/upload-artifact@v7
        with:
          name: download-notebooks
          path: download-notebooks.zip
      - name: Copy Download Notebooks for GH-PAGES
        shell: bash -l {0}
        run: |
          mkdir -p _build/html/_notebooks
          cp -u _build/jupyter/*.ipynb _build/html/_notebooks
      # Final Build of HTML (with assets)
      - name: Build HTML
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ -n -W --keep-going
      - name: Deploy website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html/
          cname: stats.quantecon.org
      - name: Prepare lecture-stats.notebooks sync
        shell: bash -l {0}
        run: |
          mkdir -p _build/lecture-stats.notebooks
          cp -a _notebook_repo/. _build/lecture-stats.notebooks
          cp _build/jupyter/*.ipynb _build/lecture-stats.notebooks
          ls -a _build/lecture-stats.notebooks
      - name: Commit notebooks to lecture-stats.notebooks
        shell: bash -l {0}
        env:
          QE_SERVICES_PAT: ${{ secrets.QUANTECON_SERVICES_PAT }}
        run: |
          git clone https://quantecon-services:$QE_SERVICES_PAT@github.com/quantecon/lecture-stats.notebooks

          cp _build/lecture-stats.notebooks/*.ipynb lecture-stats.notebooks

          cd lecture-stats.notebooks
          git config user.name "QuantEcon Services"
          git config user.email "admin@quantecon.org"
          git add *.ipynb
          git commit -m "auto publishing updates to notebooks"
          git push origin main
