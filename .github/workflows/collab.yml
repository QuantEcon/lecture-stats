name: Build Project on Google Collab (Execution)
on: [pull_request]
jobs:
  execution-checks:
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.2xlarge/image=ubuntu24-gpu-x64/volume=80gb/spot=false"
    permissions:
      contents: read
      pull-requests: write
      actions: read     # dawidd6/action-download-artifact reads the cache.yml build artifact
    container:
      image: docker://us-docker.pkg.dev/colab-images/public/runtime
      options: --gpus all
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check nvidia drivers
        shell: bash -l {0}
        run: |
          nvidia-smi
      - name: Check python version
        shell: bash -l {0}
        run: |
          python --version
      - name: Display Pip Versions
        shell: bash -l {0}
        run: pip list
      - name: Download "build" folder (cache)
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: cache.yml
          branch: main
          name: build-cache
          path: _build
      # Install build software
      - name: Install Build Software
        shell: bash -l {0}
        run: |
          pip install jupyter-book==1.0.3 quantecon-book-theme==0.8.2 sphinx-tojupyter==0.3.0 sphinxext-rediraffe==0.2.7 sphinxcontrib-youtube==1.3.0 sphinx-togglebutton==0.3.2 arviz sphinx-proof sphinx-exercise sphinx-reredirects
          # The Colab image ships plotly 5.24.1 and no kaleido, so back_prop.md's
          # `!pip install kaleido` cell pulls kaleido 1.x, which is incompatible.
          # Pinning here makes that cell a no-op. Unlike the conda workflows, this
          # container is a coherent numpy 2.0.2 stack, so it needs no numpy pin.
          pip install "kaleido<1"
      # Build of HTML (Execution Testing)
      - name: Build HTML
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ -n -W --keep-going
      - name: Upload Execution Reports
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: execution-reports
          path: _build/html/reports
      - name: Preview Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: '_build/html/'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
